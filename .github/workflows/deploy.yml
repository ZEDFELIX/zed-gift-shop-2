name: Deploy ZED Gift Shop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ❌ Cancel if production build is already running
        uses: styfle/cancel-job-action@0.1.0

      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Generate Prisma client
        run: npx prisma generate

      - name: 🏗️ Type check
        run: npm run typecheck

      - name: 🏗️ Build Next.js app
        run: npm run build

      - name: 📤 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .next
          keep_files: false
          silent: true
          commit_message: "chore: deploy ZED Gift Shop to GitHub Pages [skip ci]"
          pull_request_message: "chore: deploy ZED Gift Shop to GitHub Pages [skip ci]"
          enable_remote: true